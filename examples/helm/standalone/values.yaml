#
# Minimum-viable values for computer-use-server.
#
# The chart runs the sandboxes under a rootless Podman sidecar, so it installs on a
# stock node: no privileged pods, no RuntimeClass, no Block-mode storage.
#
# The only hard requirement is that you name a StorageClass for each of the four
# volumes below — the chart refuses to render otherwise, rather than letting a PVC
# silently take whichever class the cluster marks default.
#
#   kubectl get storageclass
#
# Optional but recommended: an AppArmor profile for the Podman sidecar, selected with
# podAnnotations. Without one the sandboxes run under the cluster's default profile.
# For a VM boundary instead, see docs/kata-runtime.md.
#
# Run:
#   helm install ocu helm/computer-use-server \
#     -n open-computer-use --create-namespace \
#     -f examples/helm/standalone/values.yaml
#
# Replace the placeholders (change-me-*, *.example.com) before applying.

# REQUIRED. Node-local suits the caches and the image store; replicated storage is
# only worth it for `data`. `standard` is a placeholder — name a class your cluster has.
persistence:
  userData:
    storageClass: standard
  data:
    storageClass: standard
  skillsCache:
    storageClass: standard
  # Podman's graph root. NOT a cache: it holds the pulled sandbox image and the named
  # volume carrying each chat's working directory. Size it for the image (~9.5 GB
  # unpacked) plus your workspaces.
  podmanStorage:
    storageClass: standard

secrets:
  create: true
  # `openssl rand -hex 32` is a fine source
  mcpApiKey: "change-me-32-hex-chars"

orchestrator:
  env:
    # MUST be the browser-reachable URL of the Ingress below (no trailing slash).
    # The orchestrator bakes this into preview links it returns to chats.
    PUBLIC_BASE_URL: "https://orchestrator.example.com"

ingress:
  enabled: true
  className: nginx
  annotations:
    # uncomment if using cert-manager
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: orchestrator.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - orchestrator.example.com
      secretName: orchestrator-tls
