apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "computer-use-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "computer-use-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  # Recreate — the orchestrator owns RWO PVCs and a container engine, neither of which can
  # safely overlap with a second copy of itself during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "computer-use-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "computer-use-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "computer-use-server.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      # The orchestrator runs as root and the podman daemon as an unprivileged uid, but they share
      # /tmp/computer-use-data: the orchestrator creates each chat's upload/output directories and
      # podman bind-mounts them into the sandbox. Without a shared group the daemon cannot write
      # there, and container creation fails with "permission denied" on the mount point — a failure
      # that reads like a Podman bug rather than a filesystem-ownership one.
      #
      # fsGroup makes the kubelet chgrp the volume to this GID and set setgid on it, so both
      # containers can write regardless of which uid each runs as.
      securityContext:
        fsGroup: {{ .Values.podman.runAsUser }}
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.orchestrator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # The Docker-API socket, which `podman system service` serves and which BOTH the
        # orchestrator and the cleanup sidecar dial. Shared through an emptyDir.
        #
        # The name predates Podman and stays: renaming it moves the mount path all three
        # containers agree on, to relabel a socket directory that was never a dind artefact.
        - name: dind-socket
          emptyDir: {}
        # Podman's graph root: images AND the named volumes that hold each chat's working
        # directory. An emptyDir here would re-pull every image and discard every workspace on
        # each pod restart, so this is a real PVC by default.
        #
        # No Block mode and no Longhorn: the Block PVC existed because virtio-fs inside a Kata
        # guest drops security.capability xattrs (kata#1888, CVE-2021-20263) and the sandbox image
        # carries file capabilities. Rootless Podman runs on the node kernel with no virtio-fs in
        # the path, so ordinary filesystem storage keeps xattrs.
        - name: podman-storage
          {{- if .Values.persistence.podmanStorage.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.podmanStorage.existingClaim }}
          {{- else if .Values.persistence.podmanStorage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "computer-use-server.fullname" . }}-podman-storage
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.podmanStorage.sizeLimit }}
          {{- end }}
        # PVCs follow the same enabled / existingClaim / emptyDir-fallback pattern
        # so disabling any volume in values.yaml does not produce an unschedulable Pod.
        - name: user-data
          {{- if .Values.persistence.userData.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.userData.existingClaim }}
          {{- else if .Values.persistence.userData.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "computer-use-server.fullname" . }}-user-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: data
          {{- if .Values.persistence.data.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim }}
          {{- else if .Values.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "computer-use-server.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: skills-cache
          {{- if .Values.persistence.skillsCache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.skillsCache.existingClaim }}
          {{- else if .Values.persistence.skillsCache.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "computer-use-server.fullname" . }}-skills-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        # ---------------------------------------------------------------------
        # 1) Orchestrator (FastAPI app)
        # ---------------------------------------------------------------------
        - name: orchestrator
          image: {{ include "computer-use-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mcp
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "computer-use-server.fullname" . }}
            - secretRef:
                name: {{ include "computer-use-server.secretName" . }}
            {{- with .Values.orchestrator.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.orchestrator.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run
            - name: user-data
              mountPath: /tmp/computer-use-data
            - name: data
              mountPath: /data
            - name: skills-cache
              mountPath: /data/skills-cache
          {{- if .Values.orchestrator.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: {{ .Values.orchestrator.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orchestrator.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.orchestrator.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.orchestrator.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.orchestrator.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: {{ .Values.orchestrator.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orchestrator.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.orchestrator.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.orchestrator.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          {{- with .Values.orchestrator.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        # ---------------------------------------------------------------------
        # 2) Container engine for the sandboxes: rootless Podman, and only that.
        #
        # There was a .Values.sandboxRuntime switch selecting Docker-in-Docker instead. The dind
        # container is gone and the key is read by nothing, so setting it has no effect — which is
        # why the comment saying otherwise had to go with it.
        #
        # The contract is load-bearing: a Docker-API socket at /var/run/docker.sock inside the
        # shared `dind-socket` emptyDir, read by TWO consumers — the orchestrator and the cleanup
        # sidecar. The volume keeps its name because renaming it would move the mount path that
        # both of them and the running pods depend on; it is a socket directory, not a dind
        # artefact.
        # ---------------------------------------------------------------------
        - name: podman
          image: "{{ .Values.podman.image.repository }}:{{ .Values.podman.image.tag }}"
          imagePullPolicy: {{ .Values.podman.image.pullPolicy }}
          # `podman system service` speaks the Docker API, so DOCKER_SOCKET is unchanged and the
          # Python docker SDK talks to it as-is. --time=0 disables the idle exit: this is a
          # long-lived sidecar, and a daemon that exits when idle would take the sandboxes with it.
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              # Rootless Podman needs a writable HOME and a runtime dir; both live in the
              # container's own filesystem, not on the shared socket volume.
              export HOME=/home/podman
              export XDG_RUNTIME_DIR=/run/user/$(id -u)
              mkdir -p "$XDG_RUNTIME_DIR"
              exec podman system service --time=0 unix:///var/run/docker.sock
          securityContext:
            # No `privileged`. That is the point of the rootless mode: the kernel boundary is
            # user namespaces plus the AppArmor profile applied via podAnnotations, not a
            # blanket capability grant.
            runAsUser: {{ .Values.podman.runAsUser }}
            runAsGroup: {{ .Values.podman.runAsUser }}
            allowPrivilegeEscalation: true  # newuidmap is setuid; rootless setup needs it
            capabilities:
              add: ["SETUID", "SETGID", "SYS_ADMIN", "MKNOD"]
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run
            - name: podman-storage
              mountPath: /home/podman/.local/share/containers
            # Mounted here as well as in the orchestrator: bind mounts the engine creates for
            # sandboxes must resolve to the same path inside this container as inside the
            # spawned one, or the sandbox sees an empty directory where the chat's files are.
            - name: user-data
              mountPath: /tmp/computer-use-data
          resources:
            {{- toYaml .Values.podman.resources | nindent 12 }}
        {{- if .Values.cleanup.enabled }}
        # ---------------------------------------------------------------------
        # 3) Cleanup sidecar — runs the same cron schedules as docker-compose.
        # ---------------------------------------------------------------------
        - name: cleanup
          image: {{ include "computer-use-server.cleanupImage" . | quote }}
          imagePullPolicy: {{ .Values.cleanup.image.pullPolicy }}
          env:
            - name: CONTAINER_MAX_AGE_HOURS
              value: {{ .Values.cleanup.containerMaxAgeHours | quote }}
            - name: DATA_MAX_AGE_DAYS
              value: {{ .Values.cleanup.dataMaxAgeDays | quote }}
            - name: DATA_DIR
              value: /tmp/computer-use-data
          volumeMounts:
            # Share the socket via the same emptyDir — see Sysbox sidecar pattern.
            - name: dind-socket
              mountPath: /var/run
            - name: user-data
              mountPath: /tmp/computer-use-data
          resources:
            {{- toYaml .Values.cleanup.resources | nindent 12 }}
        {{- end }}
