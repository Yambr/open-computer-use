{{ if and .Values.persistence.data.enabled (not .Values.persistence.data.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "computer-use-server.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "computer-use-server.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
  {{/*
  Required, with no default. A PVC that omits storageClassName silently takes whichever class
  the cluster marks default — which is a different storage system on every cluster, and on the
  one this chart was written against it was replicated storage that these volumes specifically
  do not want. Failing the render is the only way a customer finds out at install time rather
  than after the data is on the wrong disk; the message names the two classes rather than
  leaving them to guess.
  */}}
  storageClassName: {{ required "persistence.data.storageClass must be set — a PVC with no class takes the cluster default, which differs per cluster. Name one of your StorageClasses (kubectl get storageclass); node-local is right for caches and large image stores, replicated for state that must survive the node." .Values.persistence.data.storageClass | quote }}
{{- end }}
