#
# Tier-1 journeys gate: import + collection health AND real execution of the
# CI-runnable journeys, on every PR that touches deploy/. The pure-logic
# journeys (the exec_sh meta-guard group) EXECUTE here and red on a regression.
# The backend-parametrized journeys (poc / fleet) need a live Docker daemon and
# a Lima + runsc stand a GitHub runner does not have; conftest loud-skips them
# so they report SKIPPED, never a pass. The live fleet leg is the tier-2 gate
# against a real stand, tracked as a follow-on. This job catches import rot,
# fixture drift, syntax breaks, and pure-logic regressions in seconds.
name: journeys-collect

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/journeys-collect.yml"
  # The browser probes install chromium at run time, so they can rot from
  # upstream drift with no repo change at all — and that rot would then surface
  # as a red on some unrelated future deploy PR. A weekly run finds it on its
  # own schedule instead. Per-PR alone was still "proven the day it merged",
  # only with a longer day.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install --upgrade pip -r deploy/tests/journeys/requirements.txt
      - name: Compile every journey module (syntax)
        run: python -m compileall -q deploy/tests/journeys
      - name: Smoke the boot-set minter (H/I fixtures render from a clean tree)
        # --collect-only never executes the minter, so a missing vendored schema
        # or a broken minter would skip H/I green rather than red. Run the minter
        # against a throwaway deployment + out-dir here: it is stdlib-only (no live
        # stand, no pip) and reds if scripts/mint_boot_set.py cannot render a
        # boot-set — e.g. if its vendored contracts/mcp schema drifts or vanishes.
        run: |
          out="$(mktemp -d)"
          python3 deploy/fleet/scripts/mint_boot_set.py --deployment ci --out-dir "$out"
          test -s "$out/boot-set.json"
      - name: Collect the journey suite (import + fixture health)
        # --collect-only imports every test module and resolves fixtures without
        # executing them; a broken import, a missing helper, or a renamed fixture
        # reds here. This is collection health only - it executes ZERO scenarios,
        # so it is NOT the journeys-pass gate. The real-run step below is.
        run: pytest --collect-only -q deploy/tests/journeys

      - name: Run the CI-runnable journeys (pure-logic; backend legs loud-skip)
        # This is the honest journeys gate: it EXECUTES scenarios rather than only
        # collecting them. The pure-logic journeys (the exec_sh meta-guard group)
        # run on a stock runner and RED on a real regression. The backend-
        # parametrized journeys (poc / fleet) require a live Docker daemon and a
        # Lima + runsc stand a GitHub runner does not have; conftest turns an
        # unreachable stack into a LOUD pytest.skip with a reason, so those legs
        # report SKIPPED (visible in -rs) and are NEVER counted as a pass. The
        # live fleet leg is the tier-2 gate against a real stand (a follow-on
        # increment), not this job.
        #
        # -o xfail_strict=true: an xfail journey that starts passing reds here
        # instead of silently xpassing. --strict-markers: an unknown mark reds
        # rather than warning. junit-xml drives the anti-vacuity guard next.
        run: |
          pytest -rs -o xfail_strict=true --strict-markers \
            --junit-xml=journeys-report.xml deploy/tests/journeys

      - name: Guard against an all-skipped vacuous pass
        # A journeys gate where EVERY scenario skipped is vacuous: it renders
        # green while running no journey. This step reds unless the number of
        # journeys that actually EXECUTED (passed/failed/xfailed, not skipped)
        # stays at or above a pinned FLOOR - a bare "> 0" would let the
        # pure-logic group silently shrink from a dozen scenarios to one and
        # still read as covered. The floor sits just below the measured
        # baseline (11 pure-logic journeys execute on this runner), so a
        # refactor that legitimately moves one scenario does not red while a
        # collapse does. Raise the floor when the executable subset grows.
        env:
          MIN_EXECUTED: '10'
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.parse("journeys-report.xml").getroot()
          suites = root.findall("testsuite") or [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skips", s.get("skipped", 0))) for s in suites)
          executed = total - skipped
          floor = int(os.environ["MIN_EXECUTED"])
          print(f"journeys: total={total} skipped={skipped} executed={executed} floor={floor}")
          if executed < floor:
              print(f"VACUOUS-OR-COLLAPSED: {executed} journey(s) executed, below the "
                    f"{floor} floor. Either everything skipped or the pure-logic "
                    f"subset collapsed. Failing the gate.")
              sys.exit(1)
          PY

  # ---------------------------------------------------------------------------
  # The N group's browser-only probes.
  #
  # Four of the twenty-two test ids need no stand: the sink control, the
  # unpoliced-channel control, and both halves of the script-execution probe
  # reproduce the isolation primitives standalone. Without this job they only
  # ever ran by hand, and "proven by running probes" decays to "proven the day
  # it merged".
  #
  # This job covers 4 of 22 — the controls and the script-execution primitive.
  # It is NOT "the N group covered": the other eighteen need a live pane, portal
  # and render frame, and they are the tier-2 gate against a real stand.
  #
  # OCU_BROWSER_E2E is SET here on purpose: with the gate set and no chromium,
  # `_require_browser` FAILS rather than skipping, so a broken install cannot
  # read as a pass.
  # ---------------------------------------------------------------------------
  frame-egress-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install playwright + chromium
        # Pinned, like the sibling job's requirements file. A floating
        # playwright changes what the probe MEANS between runs: the same green
        # would be measuring a different browser contract each week.
        run: |
          python -m pip install --upgrade pip
          # The journeys conftest imports yaml, so the suite's own requirements
          # come first — measured: without them the job dies at collection with
          # ModuleNotFoundError before a single probe runs. My local venv had it
          # already, which is exactly why the CI run is the one that counts.
          python -m pip install -r deploy/tests/journeys/requirements.txt
          python -m pip install "playwright==1.62.0" "pytest==9.1.1"
          python -m playwright install --with-deps chromium
      - name: Run the standalone probes
        env:
          OCU_BROWSER_E2E: "1"
        # -k selects the four that need no stand and DESELECTS the other
        # eighteen. Deselected is not skipped: they never run, never reach -rs,
        # and never enter the junit — measured, `-rs` reports zero SKIPPED lines
        # here. Their absence is detectable only through the equality guard
        # below, which is why that guard is the load-bearing half of this job.
        run: |
          pytest -rs -o xfail_strict=true --strict-markers \
            --junit-xml=n-group-report.xml \
            -k "n0 or n2 or n4" \
            deploy/tests/journeys/test_n_frame_egress.py
      - name: Guard against a vacuous browser-probe pass
        # Same failure this file already guards for the journeys: a suite where
        # everything skipped renders green. Four is the measured count, and it
        # is an equality rather than a floor -- a probe silently dropping out of
        # the selection is the regression, and a floor would hide it.
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("n-group-report.xml").getroot()
          suites = root.findall("testsuite") or [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skips", s.get("skipped", 0))) for s in suites)
          executed = total - skipped
          print(f"browser probes: total={total} skipped={skipped} executed={executed}")
          if executed != 4:
              print(f"EXPECTED 4 executed browser probes, got {executed}. Either a "
                    f"probe stopped running or one was added without updating this "
                    f"count. Both need a look.")
              sys.exit(1)
          PY
