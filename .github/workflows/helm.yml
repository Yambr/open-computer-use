# Copyright (c) 2025 Open Computer Use Contributors
#
# Lints the Helm chart on every PR / push to main, and publishes versioned
# tarballs to a "gh-pages" Helm repo on release tags. Users can then:
#
#   helm repo add open-computer-use https://wide-moat.github.io/open-computer-use
#   helm repo update
#   helm install ocu open-computer-use/computer-use-server
#
# Chart version (helm/computer-use-server/Chart.yaml `version:`) must be bumped
# for chart-releaser to publish. `appVersion:` tracks the repo version.

name: Helm chart

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'helm/**'
      - 'examples/helm/**'
      - '.github/workflows/helm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'helm/**'
      - 'examples/helm/**'
      - '.github/workflows/helm.yml'

jobs:
  lint:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.16.4   # Helm 3 LTS — chart-releaser-action does not yet ship a Helm 4 image
                            # and Helm 3 lints/templates the chart identically for our purposes.

      - name: helm lint (rejects missing required values)
        run: |
          set -e
          # Should fail — schema requires either secrets.mcpApiKey or secrets.existingSecret.
          if helm lint helm/computer-use-server 2>/dev/null; then
            echo "BUG: helm lint should have failed with empty secrets" >&2
            exit 1
          fi
          # storageClass is enforced by `required` in the PVC templates, not by the schema,
          # so `helm lint` cannot see it — it validates values and never renders. The check
          # belongs on `helm template`, and lives in the next step.
          # Should pass with all required keys set
          helm lint helm/computer-use-server \
            --set secrets.create=true \
            --set secrets.mcpApiKey=test \
            --set orchestrator.env.PUBLIC_BASE_URL=https://x.example.com \
            --set persistence.userData.storageClass=standard \
            --set persistence.data.storageClass=standard \
            --set persistence.skillsCache.storageClass=standard \
            --set persistence.podmanStorage.storageClass=standard
          # Examples must lint cleanly
          helm lint helm/computer-use-server -f examples/helm/standalone/values.yaml
          helm lint helm/computer-use-server -f examples/helm/with-open-webui/values-computer-use.yaml

      - name: helm template (default rootless Podman + Kata opt-in)
        run: |
          set -e
          # A missing storageClass must stop the render rather than produce a PVC that
          # silently takes whichever class the cluster marks default. Enforced by
          # `required` in the PVC templates, which is why this is a template-time check.
          if helm template ocu helm/computer-use-server \
               --set secrets.create=true \
               --set secrets.mcpApiKey=test \
               --set orchestrator.env.PUBLIC_BASE_URL=https://x.example.com \
               >/dev/null 2>&1; then
            echo "BUG: helm template should have failed with no storageClass" >&2
            exit 1
          fi
          # Default — rootless Podman, on a stock node.
          helm template ocu helm/computer-use-server \
            -f examples/helm/standalone/values.yaml \
            > /tmp/render-default.yaml
          grep -q "name: orchestrator" /tmp/render-default.yaml
          grep -q "name: podman" /tmp/render-default.yaml
          grep -q "name: cleanup" /tmp/render-default.yaml
          grep -q "podman-storage" /tmp/render-default.yaml
          # None of what the chart used to demand of a cluster.
          ! grep -q "privileged: true" /tmp/render-default.yaml
          ! grep -q "runtimeClassName:" /tmp/render-default.yaml
          ! grep -q "volumeMode: Block" /tmp/render-default.yaml
          ! grep -q "var-lib-docker" /tmp/render-default.yaml
          # NB: not `name: dind` — that also matches the dind-socket volume, whose name is
          # historical (Podman serves the Docker API on that socket). Match the container.
          ! grep -qE "^ {8}- name: dind$" /tmp/render-default.yaml
          # An older values file naming the removed switch must not resurrect dind.
          ! helm template ocu helm/computer-use-server \
              -f examples/helm/standalone/values.yaml \
              --set sandboxRuntime=docker \
            | grep -qE "^ {8}- name: dind$"
          # Kata opt-in still renders the VM boundary.
          helm template ocu helm/computer-use-server \
            -f examples/helm/standalone/values.yaml \
            --set orchestrator.runtimeClassName=kata-qemu-heavy \
            > /tmp/render-kata.yaml
          grep -q "runtimeClassName: kata-qemu-heavy" /tmp/render-kata.yaml
          grep -q "name: podman" /tmp/render-kata.yaml

      - name: Install kubeconform and validate manifests against k8s schemas
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/render-default.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/render-kata.yaml

  release:
    name: Publish chart to gh-pages
    needs: lint
    runs-on: ubuntu-latest
    # Only on stable release tags. SemVer pre-release suffixes (`-rc.N`,
    # `-alpha.N`, `-beta.N`) are routed to OCI publish via release-chart.yml
    # — they must NOT land on gh-pages, otherwise stable users running
    # `helm repo update && helm install` would resolve them.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # chart-releaser needs full history to detect tag bumps

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.16.4

      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
        with:
          charts_dir: helm
          mark_as_latest: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
