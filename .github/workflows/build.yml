name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  SANDBOX_IMAGE: ghcr.io/${{ github.repository }}
  SERVER_IMAGE: ghcr.io/${{ github.repository }}-server

jobs:
  build-sandbox:
    name: Build Sandbox Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The pushed image digest (sha256:...), consumed by `sign` and `promote`
      # below. Empty on pull_request, where the push step does not run.
      digest: ${{ steps.push.outputs.digest }}
    env:
      # Local only. Never reaches a registry, so it cannot be pulled by
      # anyone and is not a consumer-reachable reference.
      LOCAL_SMOKE_TAG: open-computer-use:smoke

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - name: Free disk space for 8GB+ image + local load
        run: |
          # Sandbox image is ~8GB; `load: true` stores an extra copy in the
          # docker daemon. Ubuntu runners start with ~14GB free; prune unused
          # preinstalled toolchains to avoid running out during smoke tests.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        id: meta
        with:
          images: ${{ env.SANDBOX_IMAGE }}
          tags: |
            type=ref,event=branch
            # Extract the tag name verbatim — docker/metadata-action's SemVer
            # parser rejects our 4-segment scheme (0.9.2.5-rc.1) and falls back
            # to sha-only tags. The match pattern is permissive — it works for
            # both 3-segment SemVer and 4-segment tags, with or without a
            # pre-release suffix.
            type=match,pattern=v(.*),group=1
            type=sha

      - name: Build into the local daemon for the smoke tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.LOCAL_SMOKE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — image packages and CLI tools
        run: |
          chmod +x tests/test-docker-image.sh
          ./tests/test-docker-image.sh "${{ env.LOCAL_SMOKE_TAG }}"

      - name: Smoke test — Chromium launches in container
        run: |
          # Use page.set_content with a local HTML string instead of going
          # over the network: this test should only validate that chromium
          # binary + wire protocol work, not internet reachability.
          docker run --rm --platform linux/amd64 \
            --entrypoint=python3 "${{ env.LOCAL_SMOKE_TAG }}" \
            -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content('<html><head><title>Example Domain</title></head><body></body></html>')
              title = page.title()
              browser.close()
              assert title == 'Example Domain', f'unexpected title: {title}'
              print(f'OK: title={title}')
          "

      - name: Lowercase the image name
        id: img
        # Registries reject uppercase in a repository name, and
        # `github.repository` carries the organisation's capitalisation.
        # metadata-action lowercased it while the name came from `tags:`;
        # push-by-digest takes the name verbatim, so do it here.
        run: |
          printf 'ref=%s\n' \
            "$(printf '%s' "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Push by digest, with no tag
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          # No `tags:`. push-by-digest uploads the manifest and returns its
          # digest without attaching any name a consumer could pull. The
          # release tag is attached by the promote job, after the signature
          # exists. Until then the image is in the registry but unreachable
          # by name -- which is the whole point of the split.
          outputs: type=image,name=${{ steps.img.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The pushed image digest (sha256:...), consumed by `sign` and `promote`
      # below. Empty on pull_request, where the push step does not run.
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        id: meta
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=ref,event=branch
            # Extract the tag name verbatim — docker/metadata-action's SemVer
            # parser rejects our 4-segment scheme (0.9.2.5-rc.1) and falls back
            # to sha-only tags. The match pattern is permissive — it works for
            # both 3-segment SemVer and 4-segment tags, with or without a
            # pre-release suffix.
            type=match,pattern=v(.*),group=1
            type=sha

      - name: Build, without publishing anything
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./computer-use-server
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lowercase the image name
        id: img
        # Registries reject uppercase in a repository name, and
        # `github.repository` carries the organisation's capitalisation.
        # metadata-action lowercased it while the name came from `tags:`;
        # push-by-digest takes the name verbatim, so do it here.
        run: |
          printf 'ref=%s\n' \
            "$(printf '%s' "ghcr.io/${{ github.repository }}-server" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Push by digest, with no tag
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./computer-use-server
          outputs: type=image,name=${{ steps.img.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  build-cleanup:
    name: Build Cleanup Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The pushed image digest (sha256:...), consumed by `sign` and `promote`
      # below. Empty on pull_request, where the push step does not run.
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-cleanup
          tags: |
            type=ref,event=branch
            # Extract the tag name verbatim — docker/metadata-action's SemVer
            # parser rejects our 4-segment scheme (0.9.2.5-rc.1) and falls back
            # to sha-only tags. The match pattern is permissive — it works for
            # both 3-segment SemVer and 4-segment tags, with or without a
            # pre-release suffix.
            type=match,pattern=v(.*),group=1
            type=sha

      - name: Build, without publishing anything
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./cron
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lowercase the image name
        id: img
        # Registries reject uppercase in a repository name, and
        # `github.repository` carries the organisation's capitalisation.
        # metadata-action lowercased it while the name came from `tags:`;
        # push-by-digest takes the name verbatim, so do it here.
        run: |
          printf 'ref=%s\n' \
            "$(printf '%s' "ghcr.io/${{ github.repository }}-cleanup" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Push by digest, with no tag
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./cron
          outputs: type=image,name=${{ steps.img.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  build-webui:
    name: Build Patched Open WebUI Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The pushed image digest (sha256:...), consumed by `sign` and `promote`
      # below. Empty on pull_request, where the push step does not run.
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-webui
          tags: |
            type=ref,event=branch
            # Extract the tag name verbatim — docker/metadata-action's SemVer
            # parser rejects our 4-segment scheme (0.9.2.5-rc.1) and falls back
            # to sha-only tags. The match pattern is permissive — it works for
            # both 3-segment SemVer and 4-segment tags, with or without a
            # pre-release suffix.
            type=match,pattern=v(.*),group=1
            type=sha

      - name: Build, without publishing anything
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./openwebui
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lowercase the image name
        id: img
        # Registries reject uppercase in a repository name, and
        # `github.repository` carries the organisation's capitalisation.
        # metadata-action lowercased it while the name came from `tags:`;
        # push-by-digest takes the name verbatim, so do it here.
        run: |
          printf 'ref=%s\n' \
            "$(printf '%s' "ghcr.io/${{ github.repository }}-webui" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Push by digest, with no tag
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./openwebui
          outputs: type=image,name=${{ steps.img.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  sign:
    name: Sign each digest, while no tag points at it
    needs: [build-sandbox, build-server, build-cleanup, build-webui]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The approval sits here rather than after publication. A reviewer holding
    # this job holds the release, and nothing is pullable by name until
    # `promote` runs -- so the wait exposes nothing. Held after a tagged push,
    # the same wait would be a window in which the image is public and
    # unsigned.
    environment: production
    permissions:
      contents: read
      id-token: write     # Cosign keyless via Sigstore OIDC.
      packages: write     # Signatures and attestations are pushed to GHCR.
      attestations: write # Build provenance in the GitHub attestation store.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            digest: ${{ needs.build-sandbox.outputs.digest }}
          - suffix: "-server"
            digest: ${{ needs.build-server.outputs.digest }}
          - suffix: "-cleanup"
            digest: ${{ needs.build-cleanup.outputs.digest }}
          - suffix: "-webui"
            digest: ${{ needs.build-webui.outputs.digest }}
    env:
      SUFFIX: ${{ matrix.suffix }}
      DIGEST: ${{ matrix.digest }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the reference, refusing an absent digest
        id: ref
        # Shared with gate3-rehearsal.yml, which exercises this exact file
        # against a throwaway registry. An inline copy here would mean the
        # rehearsal proves the copy.
        run: bash tests/security/resolve_ref_guard.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409  # v3.7.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@fc46e51fd3cb168ffb36c6d1915723c47db58abb  # v0.17.7
        with:
          # Pinning `uses:` pins the action, not the scanner it fetches.
          # Held at the build the pipeline already resolved to, so this
          # changes determinism and not the SBOM's contents.
          syft-version: v1.16.0

      - name: Generate SBOM (SPDX JSON)
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: syft "$IMAGE_REF" -o spdx-json=sbom.spdx.json

      - name: Refuse to attest an SBOM that describes nothing
        # Shared with gate3-rehearsal.yml, which drives this script through
        # three fixtures that each violate one of its conditions.
        run: bash tests/security/sbom_guard.sh sbom.spdx.json

      - name: Sign the digest (keyless via Sigstore)
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest the SBOM against the digest
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE_REF"

      - name: Derive the lowercase provenance subject name
        # `subject-name` is the image name alone, while resolve_ref_guard.sh
        # emits name@digest. Registries reject uppercase in a repository name
        # and `github.repository` carries the organisation's capitalisation,
        # so the same fold applied there is applied here.
        run: |
          printf 'SUBJECT_NAME=ghcr.io/%s%s\n' \
            "$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')" "$SUFFIX" >> "$GITHUB_ENV"

      - name: Attest build provenance against the same digest
        # SLSA provenance recorded in the GitHub attestation store (`gh
        # attestation verify`) and pushed to the registry beside the image.
        # The cosign signature says who signed the bytes; the provenance says
        # which workflow, at which commit, produced them. It runs inside
        # `sign` so that, like the signature, it exists before `promote`
        # attaches the first reference a consumer can pull.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ${{ env.SUBJECT_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

  promote:
    name: Attach release tags to digests that are already signed
    # `sign` is in `needs`, so this job cannot start until every signature
    # exists. That edge is the whole gate: it is what makes the tag -- the
    # first reference a consumer can pull -- appear after the signature
    # rather than beside it.
    needs: [build-sandbox, build-server, build-cleanup, build-webui, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            digest: ${{ needs.build-sandbox.outputs.digest }}
          - suffix: "-server"
            digest: ${{ needs.build-server.outputs.digest }}
          - suffix: "-cleanup"
            digest: ${{ needs.build-cleanup.outputs.digest }}
          - suffix: "-webui"
            digest: ${{ needs.build-webui.outputs.digest }}
    env:
      SUFFIX: ${{ matrix.suffix }}
      DIGEST: ${{ matrix.digest }}
      REPO: ${{ github.repository }}

    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=match,pattern=v(.*),group=1
            type=sha

      - name: Point every release tag at the signed digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::no digest to promote" >&2
            exit 1
          fi
          repo_lower="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          src="ghcr.io/${repo_lower}${SUFFIX}@${DIGEST}"
          printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d' | while read -r tag; do
            echo "promoting ${tag} -> ${src}"
            docker buildx imagetools create --tag "$tag" "$src"
          done

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - name: Run structure and English-only tests
        run: |
          chmod +x tests/test-project-structure.sh tests/test-no-cyrillic.sh tests/test-system-prompt-skills-contract.sh
          ./tests/test-project-structure.sh
          ./tests/test-no-cyrillic.sh
          ./tests/test-system-prompt-skills-contract.sh

  pytest-orchestrator:
    name: Pytest — orchestrator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Install server deps
        run: |
          pip install -r computer-use-server/requirements.txt
          # Pinned for the same reason requirements.txt is: unpinned, each run
          # resolves whatever PyPI serves that day, so a red can arrive from an
          # upstream release nobody here chose. Measured: a June run resolved
          # pytest 9.0.3, today it resolves 9.1.1 -- the test framework changed
          # under the suite with no commit. pytest-asyncio 1.4.0 declares
          # pytest<10,>=8.4, so it accepts this pin.
          pip install pytest==9.1.1 pytest-asyncio==1.4.0

      - name: Run orchestrator pytest
        run: pytest tests/orchestrator/ -v

  smoke-mcp-endpoint:
    name: Smoke — POST /mcp returns 200
    runs-on: ubuntu-latest
    # Catches the failure mode where /health is up but /mcp returns 500
    # because the lifespan never entered session_manager.run() (e.g. a
    # missing module COPY in the Dockerfile silently makes the import fail).
    # This is the test that, had it existed earlier, would have caught the
    # 2026-04-19 regression in one CI run.

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build computer-use-server image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./computer-use-server
          load: true
          tags: cu-server:smoke
          cache-from: type=gha,scope=server-smoke
          cache-to: type=gha,mode=max,scope=server-smoke

      - name: Start computer-use-server
        run: |
          # No real Docker socket needed for this smoke — the orchestrator
          # only needs to boot, register MCP, and respond to /health + /mcp.
          # We don't exercise sandbox container creation here.
          docker run -d --name cu-server -p 8081:8081 \
            -e PUBLIC_BASE_URL=http://localhost:8081 \
            -e BASE_DATA_DIR=/tmp/data \
            cu-server:smoke

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/health >/dev/null 2>&1; then
              echo ""; echo "healthy after ${i}s"; exit 0
            fi
            printf '.'
            sleep 1
          done
          echo ""; echo "TIMEOUT — server never became healthy"
          docker logs cu-server || true
          exit 1

      - name: Smoke /mcp endpoint
        run: |
          chmod +x tests/test-mcp-endpoint-live.sh
          ./tests/test-mcp-endpoint-live.sh http://localhost:8081

      - name: Dump server logs on failure
        if: failure()
        run: docker logs cu-server || true

  integration:
    name: Integration — real MCP + Docker
    runs-on: ubuntu-latest
    # Catches what unit tests don't: auth wiring, tools/call dispatch, real
    # container spawn, and label/mount plumbing. Production parity: we use
    # the runner's host /var/run/docker.sock — identical to compose & helm.
    needs: [build-sandbox, build-server]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The job depends on locally-tagged workspace + server images (the
    # docker-compose.test.yml hard-codes :test tags). Building both inline
    # keeps the job hermetic — it doesn't pull from ghcr and doesn't race
    # the publish step.

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - name: Free disk space for the workspace image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build workspace image (linux/amd64, local tag)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: open-computer-use:test
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox-integration

      - name: Build server image (local tag)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./computer-use-server
          push: false
          load: true
          tags: open-computer-use-server:test
          cache-from: type=gha,scope=server-smoke
          cache-to: type=gha,mode=max,scope=server-integration

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Install test deps
        # Pinned: see the orchestrator job. pytest-timeout 2.4.0 declares
        # pytest>=7.0.0, so it accepts this pin.
        run: pip install httpx==0.28.1 pytest==9.1.1 pytest-timeout==2.4.0

      - name: Bring up the integration stack
        run: |
          mkdir -p tests/integration/_tmp/user-data
          docker compose -f docker-compose.test.yml up -d
          # pytest's session fixture also waits for /health, but doing it
          # here too means a startup crash surfaces in this step's log
          # instead of being attributed to the first test.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18081/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Orchestrator never became healthy"
          docker compose -f docker-compose.test.yml logs
          exit 1

      - name: Run integration suite
        env:
          OCU_TEST_BASE_URL: http://localhost:18081
          OCU_TEST_MCP_API_KEY: test-token-do-not-use-in-prod
        run: pytest tests/integration/ -v

      - name: Orchestrator logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Spawned workspace logs on failure (best-effort)
        if: failure()
        run: |
          # Only the test-side workspaces (owui-chat-itest-*) — never touch
          # other managed-by-orchestrator containers a developer may have.
          for c in $(docker ps -aq --filter 'name=owui-chat-itest-' \
                                   --filter 'label=managed-by=mcp-computer-use-orchestrator'); do
            echo "::group::workspace $c"
            docker logs "$c" 2>&1 | tail -100 || true
            echo "::endgroup::"
          done

      - name: Always tear down — stack + test workspaces
        if: always()
        run: |
          # Reap any orphan test workspaces from a crashed test before compose
          # down, in case the pytest session fixture didn't get to clean up.
          # Scoped to the test container-name prefix so we never nuke prod.
          docker ps -aq --filter 'name=owui-chat-itest-' \
                        --filter 'label=managed-by=mcp-computer-use-orchestrator' \
            | xargs -r docker rm -f || true
          docker compose -f docker-compose.test.yml down -v --remove-orphans || true
