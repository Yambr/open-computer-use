# SPDX-License-Identifier: FSL-1.1-Apache-2.0
# Copyright (c) 2025 Open Computer Use Contributors
#
# Security gates — the three a bank auditor opens first, per CLAUDE.md
# "Testing & QA discipline (next/v1)":
#
#   1. Secrets scan blocks merge (gitleaks + trufflehog).
#   2. SAST/SCA CRITICAL blocks merge (Semgrep + Trivy).
#   3. IaC scan (Checkov) — every Helm finding blocks merge except the named
#      per-check exclusions at the job, each carrying the reason it cannot be
#      answered in the chart. Severity thresholds do not work here: open-source
#      checkov assigns these k8s checks no severity, so a threshold matches
#      nothing and lets everything through.
#
# Signed SBOM + Cosign attestations for release artifacts live in
# supply-chain.yml; this file covers the commit-time / PR-time gates.
#
# Per-rule "HIGH exception" file: .github/security-exceptions.yml.
#
# Pinning policy (mandatory for every `uses:` and container `image:`):
#   - Third-party actions pinned to a 40-char commit SHA, never to a
#     movable tag (scripts/check-pin-policy.py blocks merge on its own).
#   - Container images pinned to `name:tag@sha256:<digest>`.
#   - Every actions/checkout call sets `persist-credentials: false`
#     (the same check; zizmor calls this rule `artipacked`).

name: security

on:
  pull_request:
  push:
    branches:
      - main
      - next/v1
  schedule:
    # Full-repo nightly re-scan (PRs are diff-only — re-confirm baseline).
    - cron: "27 3 * * *"

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  # Do NOT cancel in-progress runs. On 5 quick commits to a PR, cancellation
  # leaves intermediate commits unscanned by semgrep/trivy/checkov (they
  # only see the working tree). gitleaks with fetch-depth: 0 catches
  # history regardless. Letting runs queue is the safer default for
  # merge-blocking gates.
  cancel-in-progress: false

jobs:
  secrets-gitleaks:
    name: secrets — gitleaks
    # NFR-SEC-19 (zero secrets in source). Named here so check-nfr-coverage.py
    # counts this requirement as armed: a row in the manifesto is a claim, and
    # the claim is only measured while a job that can FAIL carries its id. This
    # job blocks -- no continue-on-error -- so the name is not decoration.
    runs-on: ubuntu-latest
    steps:
      # Fork-PR-safe two-source pattern. The PR HEAD provides the source
      # files to scan, but the gitleaks CONFIG comes from the BASE ref —
      # never from the PR head. Without this split, a fork PR could ship
      # a permissive allowlist (`paths = ['''.*''']`) and the gate would
      # pass green for any secret introduced in that PR. Canonical CI
      # supply-chain attack against allowlist-based scanners.
      #
      # We fetch the base-ref config directly via `gh api` rather than
      # checking out the base branch. sparse-checkout has long-standing
      # quirks with non-cone single-file patterns in actions/checkout@v4
      # and silently produces an empty working tree, which would re-open
      # the fork-bypass hole.
      - name: Checkout PR head (source)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pr-head
      - name: Fetch base-ref .gitleaks.toml via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          REPO: ${{ github.repository }}
        # Always produce config/.gitleaks.toml. Two paths:
        #
        # 1. Base ref has a real .gitleaks.toml — fetch and use it.
        # 2. Base ref has no .gitleaks.toml (bootstrap PRs, or any feature
        #    branch off a base that hasn't merged the file yet) — write a
        #    tiny stub that says "use the upstream default ruleset".
        #
        # Without this stub, the docker step would have to omit `--config`,
        # and gitleaks falls back to autoload `/repo/.gitleaks.toml` per
        # its documented config precedence (step 4 in `gitleaks detect
        # --help`). `/repo` is the PR head, so a fork PR shipping a
        # permissive allowlist (`paths = ['''.*''']`) would silently
        # bypass the gate — the canonical attack the two-source pattern
        # is supposed to close. Writing the stub keeps `--config` always
        # on the command line and pins precedence to step 1.
        #
        # An explicit `gh api` `--jq` type check guards against the case
        # where the URL resolves to a directory listing rather than a
        # file — in that scenario `.content` is null and would produce a
        # zero-byte file that gitleaks would silently accept.
        run: |
          mkdir -p config
          # On a 404 (no config on the base ref) gh prints the error JSON
          # to stdout and exits non-zero; reset content to empty so the
          # stub branch below handles it instead of base64-decoding JSON.
          content="$(gh api "repos/${REPO}/contents/.gitleaks.toml?ref=${BASE_REF}" \
            --jq '.content // empty' 2>/dev/null)" || content=""
          if [ -n "$content" ]; then
            # The contents API base64-encodes with embedded newlines;
            # strip them or `base64 -d` rejects the input on Linux.
            printf '%s' "$content" | tr -d '\n' | base64 -d > config/.gitleaks.toml
            echo "Fetched $(wc -c < config/.gitleaks.toml) bytes of base-ref gitleaks config."
          elif [ -f pr-head/.gitleaks.toml ]; then
            # Bootstrap: the base ref has no config yet (it is being
            # introduced by this very change). The base-ref-wins rule
            # protects an EXISTING config from being weakened by a PR;
            # with none to protect, the tree's own config applies.
            cp pr-head/.gitleaks.toml config/.gitleaks.toml
            echo "No config on base ref ${BASE_REF}; using the tree's own (bootstrap)."
          else
            printf '[extend]\nuseDefault = true\n' > config/.gitleaks.toml
            echo "No .gitleaks.toml on base ref ${BASE_REF} — wrote useDefault stub."
          fi
      - name: Run gitleaks (Docker)
        # The official gitleaks-action requires a paid license for GitHub
        # Organizations. Use the upstream Docker image directly — same
        # detect engine, no license server. Pinned by digest so a future
        # `:latest` push cannot silently change scan behaviour on a
        # merge-blocking gate.
        #
        # Two separate mounts: /repo for source (PR head), /config for
        # the gitleaks config (always populated by the previous step —
        # either the real base-ref file or a useDefault stub). `--config`
        # is always passed so gitleaks cannot autoload
        # `/repo/.gitleaks.toml`.
        #
        # :ro mounts + non-root user + --read-only container fs are
        # defence-in-depth against a compromised gitleaks image (digest
        # pin above is the first layer).
        run: |
          docker run --rm \
            --read-only \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/pr-head:/repo:ro" \
            -v "${{ github.workspace }}/config:/config:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-banner --redact --exit-code 1 \
            --config=/config/.gitleaks.toml

  secrets-trufflehog:
    name: secrets — trufflehog
    # NFR-SEC-19, second reading. Two scanners with different corpora, both
    # blocking: gitleaks alone leaves the requirement resting on one tool's
    # rule set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@0ec3634f6cf66a61912a923fee9d20cc45633a67  # main as of 2026-05-24
        with:
          path: ./
          # `--fail` is appended by the action's entrypoint — passing it
          # here a second time triggers "flag 'fail' cannot be repeated".
          #
          # `--no-verification` removes the egress data-exfiltration path:
          # default `--results=verified` dials AWS/GitHub/Slack/… from the
          # runner to validate detected patterns. For a bank-targeting CI
          # we accept the higher false-positive rate over outbound calls.
          #
          # `--exclude-paths` drops generated render artifacts that cannot hold
          # a credential but trip detectors on embedded-font entropy (see
          # .github/trufflehog-exclude.txt). The .drawio source stays in scope.
          extra_args: --no-verification --exclude-paths=.github/trufflehog-exclude.txt

  sast-semgrep:
    name: SAST — semgrep
    # Temporarily non-blocking by owner direction 2026-08-01. Remove this flag and
    # the line below to restore the gate; the job still runs and still reports.
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      # Org renamed from `returntocorp/semgrep` to `semgrep/semgrep`. Same
      # image; the old name is mirrored but won't be updated forever.
      image: semgrep/semgrep:1.163.0@sha256:7cad2bc2d1e44f87f0bf4be6d1fa23aa90fb72015bebc89fb91385d813987a03
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Diff-aware semgrep needs history back to the merge-base.
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test the hand-written rules before trusting their verdict
        # `semgrep test` checks each `ruleid:`/`ok:` annotation in the fixture
        # against the rule that actually fired, so a finding raised for the
        # wrong reason fails here rather than passing as coverage. A rule whose
        # own fixture does not hold should not be allowed to gate anything.
        # `semgrep test <dir>` and NOT `--test --config <dir> <dir>`: passing the
        # directory as both config and target makes semgrep read it as a
        # rules/tests split and abort with "the split of tests/ and rules/ is not
        # supported yet", which reported "No unit tests found" and failed the
        # gate — a rule self-test that never ran, reading as a rule that has none.
        # `semgrep test` has no --metrics flag (it rejects one), so the
        # suppression rides the documented env var instead. A security gate that
        # phones home on every run is a gate with an unnecessary egress leg.
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep test .semgrep/

      - name: Semgrep CI (community rules)
        env:
          # Required for diff-aware scanning + PR commenting. Without it,
          # `semgrep ci` falls back to a full-repo scan. Token is
          # workflow-scoped and short-lived.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `semgrep ci` exits non-zero on findings by default. The
          # `--suppress-errors` flag has the inverse meaning — DON'T set
          # it. We pin it to false explicitly so a future runner-level
          # env override can't silently downgrade the gate.
          SEMGREP_SUPPRESS_ERRORS: "false"
        run: |
          # Verified registry packs as of 2026-05-24: p/bash and p/yaml
          # do not exist on semgrep.dev (HTTP 404) — do not add them
          # without first probing /c/p/<name>. Bash-in-YAML coverage
          # comes from p/security-audit + p/github-actions; Docker
          # socket misuse from p/dockerfile.
          #
          # `--config .semgrep/` adds the hand-written rules. They exist
          # because the six packs below load 694 rules, run 205 of them
          # against this repository's Python, and cover none of the one
          # idiomatic regression its own code can produce. Measured, not
          # assumed: see the header of the rule file.
          #
          # `--exclude` keeps the rule fixtures out of the scan. They contain
          # the real vulnerable forms by construction, so without this the
          # gate reddens on its own test data -- verified: 4 findings with the
          # fixture in scope, 0 with it excluded.
          semgrep ci \
            --exclude '*.fixture.py' \
            --config ".semgrep/" \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/python" \
            --config "p/javascript" \
            --config "p/dockerfile" \
            --config "p/github-actions"

  sca-trivy-fs:
    name: SCA — trivy (filesystem)
    # Temporarily non-blocking by owner direction 2026-08-01. Remove this flag and
    # the line below to restore the gate; the job still runs and still reports.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          # Pinning the action pins the wrapper, not the scanner. Without
          # this input the action fetches whatever release its own default
          # names, so two runs over an unchanged tree can reach different
          # verdicts and neither is reproducible from the repository. Held
          # at the value that default resolves to today, so this commit
          # changes determinism and nothing else; moving the scanner is a
          # separate decision that can change findings.
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          # Block merge on CRITICAL. HIGH gets a 14-day grace via the
          # exceptions file; everything else is informational.
          severity: CRITICAL
          exit-code: "1"
          # `ignore-unfixed: false` — a CRITICAL CVE without an upstream
          # fix is exactly the class a bank auditor asks about first.
          # Force an explicit dated entry in `security-exceptions.yml`
          # before merge, rather than silently green-lighting it.
          ignore-unfixed: false
          skip-dirs: "node_modules,.venv,.planning,docs/future-architecture"
          format: sarif
          output: trivy-fs.sarif
          # Without this, trivy-action drops `severity: CRITICAL` whenever
          # `format: sarif` is set (entrypoint.sh unsets TRIVY_SEVERITY), so
          # trivy scans for HIGH/MEDIUM/LOW too and exits 1 on the first
          # finding — even though SARIF upload filters back to CRITICAL on
          # the GitHub side. The "Building SARIF report with all severities"
          # log line is the smoking gun. Issue:
          # https://github.com/aquasecurity/trivy-action/issues/309
          limit-severities-for-sarif: true
      - name: Upload SARIF (CRITICAL)
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43  # v4.37.5
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      # Second pass - HIGH severity, BLOCKING on FIXABLE findings only
      # (ignore-unfixed: true). A fixable HIGH has a bump answer, so this
      # enforces bump-not-ignore: the gate reds until the dependency is
      # raised to its patched version. Unfixed HIGHs (no upstream fix) do
      # not block here; the nightly scan keeps them visible and the
      # security-exceptions ledger tracks any accepted waiver. This is the
      # fleet-uniform Trivy normal form (CRITICAL blocks incl. unfixed;
      # HIGH blocks fixable-only).
      - name: Trivy filesystem scan (HIGH, blocking on fixable)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          # Same scanner build as the CRITICAL pass above. If the two passes
          # drift apart, the exception ledger starts describing findings the
          # blocking pass never produced.
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          severity: HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: "node_modules,.venv,.planning,docs/future-architecture"
          format: sarif
          output: trivy-fs-high.sarif
          limit-severities-for-sarif: true
      - name: Upload SARIF (HIGH)
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43  # v4.37.5
        with:
          sarif_file: trivy-fs-high.sarif
          category: trivy-fs-high

  iac-checkov:
    name: IaC — checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install checkov
        run: pip install checkov==3.2.314
      - name: Install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: v3.16.4
      - name: Assert the chart renders before scanning it
        # checkov renders the chart itself and only WARNS when that fails, so a
        # chart that cannot render produces zero findings and a green gate. That
        # is what happened here: values.schema.json requires a secret source and
        # a public base URL (correctly — it stops a deployment landing with no
        # secret), checkov rendered with defaults, hit the schema error, and
        # scanned nothing. Rendering here first turns that silent state into a
        # red one.
        run: |
          set -euo pipefail
          # --namespace, because the chart takes its namespace from
          # {{ .Release.Namespace }} and a render without one lands every
          # resource in `default` -- which makes CKV_K8S_21 fire on the
          # renderer's choice rather than on the chart. Measured: it accounts
          # for 6 of the 19 findings the skip list currently hides, and
          # disappears entirely once a namespace is supplied.
          helm template scan helm/computer-use-server \
            --namespace ocu \
            -f .github/checkov/helm-scan-values.yaml > /tmp/rendered.yaml
          # A chart that renders to nothing would also scan clean.
          test "$(grep -c '^kind:' /tmp/rendered.yaml)" -gt 0 \
            || { echo "the chart rendered no manifests - refusing to report a clean scan" >&2; exit 1; }
          echo "rendered $(grep -c '^kind:' /tmp/rendered.yaml) manifests"
      - name: Run checkov
        # Scope: only Helm (the next/v1 deployment substrate). The legacy
        # Dockerfile + older workflows have pre-existing findings that belong in
        # a separate cleanup PR — they are not the subject of this gate.
        #
        # --var-file supplies the values the chart's schema requires; without it
        # checkov's own render fails and the scan silently covers nothing.
        #
        # The gate BLOCKS. It does not use --soft-fail-on: open-source checkov
        # assigns these k8s checks no severity at all, so a severity list matches
        # nothing and rejects every finding alike (measured: --soft-fail-on
        # LOW,MEDIUM,HIGH exits 2 on a failing manifest, --soft-fail exits 0).
        # A per-check skip-list is the only instrument that discriminates here,
        # so each exclusion below names the specific reason it cannot be fixed
        # in the chart, and everything not named blocks the merge.
        #
        # --skip-path templates/tests: the helm-test Pod lives for the seconds a
        # `helm test` takes. Liveness probes, resource limits, and an image
        # digest on a pod that exits after one curl are noise, not posture.
        #
        # CKV_K8S_21 (default namespace): a render artifact. The templates set
        # no namespace because the release supplies it via --namespace; checkov
        # renders without one and reports the default it invented itself.
        #
        # CKV_K8S_16 (privileged): the dind container IS a container runtime.
        # Its privilege is the isolation boundary this platform is built on
        # (the sandbox runs inside it, not beside it), not an oversight.
        #
        # CKV_K8S_43 / CKV_K8S_15 (image digest, pullPolicy Always): the chart
        # ships tag-based defaults so a self-hoster can install without first
        # resolving digests. Pinning is a deployment decision the values expose,
        # not something the chart can decide for every operator.
        #
        # CKV_K8S_35 (secrets as files): MCP_API_KEY reaches the orchestrator
        # through envFrom because the server reads it from the environment.
        # Changing that is a server change, tracked separately from this gate.
        #
        # The remaining exclusions are properties of the two container IMAGES,
        # which no values edit can change, so blocking on them would only stop
        # every merge until the images are rebuilt. Each is tracked in #322.
        #
        # CKV_K8S_23 / CKV_K8S_40 (root, high UID): the orchestrator image runs
        # as root and dind must. The cleanup sidecar's `crond` reads
        # /etc/crontabs as root and refuses to start otherwise.
        #
        # CKV_K8S_20 (allowPrivilegeEscalation): dind spawns the container
        # runtime; the orchestrator image needs it for the same reason it runs
        # as root. The cleanup sidecar already sets it false.
        #
        # CKV_K8S_37 / CKV_K8S_28 (capabilities, NET_RAW): dropping ALL on dind
        # breaks the daemon it exists to run. The cleanup sidecar drops ALL.
        #
        # CKV_K8S_22 (read-only root filesystem): dind writes its graph driver
        # under /var/lib/docker and the cleanup sidecar appends to
        # /var/log/cleanup.log — neither is a mounted volume. Enforcing this
        # would leave both silently non-functional rather than secure.
        #
        # CKV_K8S_8 / CKV_K8S_9 (probes on dind and cleanup): neither serves a
        # health endpoint. The orchestrator, which does, has both.
        #
        # CKV2_K8S_6 (NetworkPolicy): the chart ships one, gated behind
        # networkPolicy.enabled, defaulting false because its egress rules must
        # match the deployment. Enabling it in the scan values would hide the
        # finding rather than answer it.
        run: |
          checkov \
            -d helm/ \
            --quiet \
            --compact \
            --framework helm \
            --var-file .github/checkov/helm-scan-values.yaml \
            --skip-path 'templates/tests' \
            --skip-check CKV_K8S_21,CKV_K8S_16,CKV_K8S_43,CKV_K8S_15,CKV_K8S_35,CKV_K8S_23,CKV_K8S_40,CKV_K8S_20,CKV_K8S_37,CKV_K8S_28,CKV_K8S_22,CKV_K8S_8,CKV_K8S_9,CKV2_K8S_6
      # Report-only, and deliberately a SECOND scan rather than a wider
      # --framework on the first. The helm framework sees the chart; the
      # kubernetes framework sees the manifests it renders to, and the two
      # disagree: with the SAME fourteen skips applied, the rendered manifests
      # still fail eight rules the skip list does not name -- CKV_K8S_10/11/12/13
      # (cpu + memory requests and limits), 29/30/31 (security context, seccomp)
      # and 38 (service-account token mounting).
      #
      # Those eight are not waived. They are INVISIBLE: --framework helm never
      # evaluates them, so no waiver was ever written and nothing reports them.
      # Widening the blocking scan would turn eight silent findings into a red
      # gate in one step, and setting resource limits or a security context is a
      # chart decision rather than a CI one (#322). Printing them keeps the
      # verdict where it is and stops the gap being something you have to
      # already know about in order to find.
      - name: what the helm framework cannot see (report-only)
        run: |
          set -uo pipefail
          checkov -f /tmp/rendered.yaml \
            --quiet --compact --framework kubernetes \
            --skip-check CKV_K8S_21,CKV_K8S_16,CKV_K8S_43,CKV_K8S_15,CKV_K8S_35,CKV_K8S_23,CKV_K8S_40,CKV_K8S_20,CKV_K8S_37,CKV_K8S_28,CKV_K8S_22,CKV_K8S_8,CKV_K8S_9,CKV2_K8S_6 \
            || true
          echo "::notice::the findings above are NOT covered by the skip list and NOT evaluated by the blocking helm-framework scan -- see #322"


  conventional-commits:
    name: commits — conventional-commits
    runs-on: ubuntu-latest
    # Accept both events. If we ever switch to `pull_request_target` as
    # mitigation for fork-PR config-injection (see secrets-gitleaks
    # header), this gate keeps firing instead of silently disabling.
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Match the Conventional Commits spec we use everywhere else.
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
            style
            revert
          requireScope: false

  release-signing-order:
    name: release — pipeline integrity (signing order, cross-job wiring)
    runs-on: ubuntu-latest
    # This gate reads workflow files, so unlike the release pipeline itself it
    # can run on a pull request and can therefore be a required check. The
    # signing pipeline is tag-triggered and produces no PR status at all; a
    # job whose `if:` excludes pull_request would be skipped, and a skipped
    # required check counts as passed, so requiring it would be worse than
    # leaving it out. This one has no `if:` and no trigger exclusion.
    #
    # It currently FAILS on this branch, correctly: build.yml publishes four
    # images on a tag, supply-chain.yml signs them on the same tag, and
    # nothing orders the two. The failure is the finding, and switching the
    # gate off because it reports a true thing is the defect this whole set of
    # gates exists to prevent.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        # Version-pinned, not hash-pinned. A hash pin belongs here by the
        # dependency policy, and inventing one unverified would be worse than
        # stating its absence -- the pin lands when the digest is fetched
        # rather than guessed.
        run: pip install pyyaml==6.0.2
      - name: Self-test the checker before trusting its verdict
        run: python3 tests/security/check_signing_precedes_publish.py --self-test
      - name: Check that no image is published before it is signed
        run: python3 tests/security/check_signing_precedes_publish.py

      - name: Self-test the cross-job wiring checker
        run: python3 tests/security/check_cross_job_outputs.py --self-test

      - name: Check that every cross-job output reference resolves
        # `${{ needs.<job>.outputs.<key> }}` evaluates to the empty string when
        # the producer is missing, misspelled, or declares something else. The
        # release pipeline carries the image digest across three jobs on
        # exactly this mechanism, and the gate3 rehearsal cannot reach it --
        # the rehearsal is one job, because its registry is a service
        # container that does not outlive the job.
        run: python3 tests/security/check_cross_job_outputs.py

      - name: Self-test the exception-ledger checker
        run: python3 tests/security/check_security_exceptions.py --self-test

      # Subpaths of one action repository share runtime state — CodeQL refuses
      # to analyze when init and analyze disagree ("Loaded a configuration file
      # for version X, but running version Y"). Dependabot opens one PR per
      # SUBPATH, so a package used through four paths arrives as four PRs that
      # each break the set in isolation, and the failure names a version
      # mismatch rather than the split bump behind it. check-pin-policy.py
      # proves each ref IS a SHA; nothing proved sibling subpaths share one,
      # which is what the checker below adds.
      - name: Self-test the action-pin checker
        run: python3 scripts/check-action-pin-consistency.py --self-test

      - name: Action subpaths of one repository share a SHA
        run: python3 scripts/check-action-pin-consistency.py

      - name: Enforce the HIGH-exception ledger
        # The ledger carried a schema with `since`, `expires`, an owner and a
        # remediation, and a note saying CI enforced none of it. An exception
        # file nothing reads is not a control: entries outlive their reasons
        # because nothing asks whether they are still needed. This is the same
        # standard being asked of sibling repositories, applied here.
        run: python3 tests/security/check_security_exceptions.py
